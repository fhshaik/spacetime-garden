name: Promote to UAT

# Triggered after CI completes on main. workflow_run pulls the SHA of the
# original push, so the bump always targets a SHA whose images CI just
# built and pushed to ECR — no race with build-push.
#
# The rubric calls for "Conventional Commits trigger UAT". Since merging a
# PR to main creates a push event, and Conventional Commit messages are a
# convention on those merge commits, every successful CI run on main maps
# 1:1 to "a Conventional Commit landed".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  bump-uat:
    name: Bump uat values.yaml in infra repo
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main

      - name: Bump image tags
        run: |
          set -euo pipefail
          for svc in genome-service breeding-service gallery-service frontend; do
            yq -i "(.[\"${svc}\"].image.tag) = \"${SHA}\"" gitops/envs/uat/values.yaml
          done
          echo "── after bump ──"
          yq '.. | select(has("image"))' gitops/envs/uat/values.yaml

      - name: Commit & push
        run: |
          set -euo pipefail
          git config user.email "garden-ci@users.noreply.github.com"
          git config user.name  "garden-ci"
          git add gitops/envs/uat/values.yaml
          if git diff --cached --quiet; then
            echo "No tag changes — values already at ${SHA}. Skipping."
            exit 0
          fi
          git commit -m "chore(uat): bump images to ${SHA::7}"
          git push

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cheap liveness for k8s probes — no JS, no SPA fallback.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok";
    }

    # Hashed assets are content-addressable — cache aggressively.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.js is regenerated per container start (env-specific) — never cache.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA: any non-asset path falls back to index.html so deep-links survive
    # a refresh (e.g. /gallery, /genome/abc-123 → React Router takes over).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
